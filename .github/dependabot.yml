version: 2
updates:
  # lazy.nvim plugins aren't a Dependabot ecosystem; .github/workflows/plugin-update.yml updates lazy-lock.json.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    exclude-paths:
      - "*.lock.yml" # generated by `gh aw compile`; refresh those with `gh aw upgrade` instead
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
