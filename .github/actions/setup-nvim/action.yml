name: Set up Neovim
description: >-
  Install Neovim on a Windows runner and point it at this config with empty data, state and cache directories.
  Check the repo out with `path: nvim` first, since Neovim reads $XDG_CONFIG_HOME/nvim.

inputs:
  version:
    description: Neovim release to install
    default: 0.12.6 # keep in sync with the Neovim you run locally
  tree-sitter-version:
    description: tree-sitter CLI release, which nvim-treesitter uses to compile parsers
    default: 0.27.1

runs:
  using: composite
  steps:
    - name: Isolate Neovim directories
      shell: pwsh
      run: |
        "XDG_CONFIG_HOME=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
        foreach ($kind in 'DATA', 'STATE', 'CACHE') {
          "XDG_${kind}_HOME=$(Join-Path $env:RUNNER_TEMP "xdg\$($kind.ToLower())")" >> $env:GITHUB_ENV
        }

    - name: Install Neovim ${{ inputs.version }}
      shell: pwsh
      env:
        NVIM_VERSION: ${{ inputs.version }}
      run: |
        $zip = Join-Path $env:RUNNER_TEMP nvim-win64.zip
        Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/v$env:NVIM_VERSION/nvim-win64.zip" -OutFile $zip
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
        $bin = Join-Path $env:RUNNER_TEMP nvim-win64\bin
        & "$bin\nvim.exe" --version
        $bin >> $env:GITHUB_PATH

    - name: Install tree-sitter CLI ${{ inputs.tree-sitter-version }}
      # Mason installs it too, but only after startup; having it on PATH lets parsers install right away.
      shell: pwsh
      env:
        TS_VERSION: ${{ inputs.tree-sitter-version }}
      run: |
        $bin = Join-Path $env:RUNNER_TEMP tree-sitter-bin
        New-Item -ItemType Directory $bin -Force | Out-Null
        $gz = Join-Path $env:RUNNER_TEMP tree-sitter.gz
        Invoke-WebRequest "https://github.com/tree-sitter/tree-sitter/releases/download/v$env:TS_VERSION/tree-sitter-windows-x64.gz" -OutFile $gz
        $in = [IO.File]::OpenRead($gz)
        $out = [IO.File]::Create((Join-Path $bin tree-sitter.exe))
        $unzip = [IO.Compression.GZipStream]::new($in, [IO.Compression.CompressionMode]::Decompress)
        $unzip.CopyTo($out)
        $unzip.Dispose(); $out.Dispose(); $in.Dispose()
        & (Join-Path $bin tree-sitter.exe) --version
        $bin >> $env:GITHUB_PATH

    - name: Provide make
      # telescope-fzf-native and LuaSnip build with `make`; the runner image only ships mingw32-make.
      shell: pwsh
      run: |
        if (Get-Command make -ErrorAction SilentlyContinue) { exit 0 }
        $mingw = Get-Command mingw32-make -ErrorAction SilentlyContinue
        if ($mingw) {
          $bin = Join-Path $env:RUNNER_TEMP make-bin
          New-Item -ItemType Directory $bin -Force | Out-Null
          Copy-Item $mingw.Source (Join-Path $bin make.exe)
          $bin >> $env:GITHUB_PATH
        } else {
          choco install make --no-progress -y
        }
