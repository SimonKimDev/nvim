name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.3.0 # same as Mason's stylua, used by conform.nvim
          args: --check .

  smoke:
    name: Startup smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          path: nvim # Neovim reads $XDG_CONFIG_HOME/nvim

      - uses: ./nvim/.github/actions/setup-nvim

      - name: Smoke test
        run: |
          nvim --headless --cmd "luafile $env:XDG_CONFIG_HOME\nvim\tests\smoke.lua" 1> smoke.log 2> smoke-stderr.log
          $code = $LASTEXITCODE
          $log = [string](Get-Content smoke.log -Raw)
          $at = $log.LastIndexOf('--- smoke report ---')
          '::group::Neovim output (plugin installs and builds)'
          if ($at -ge 0) { $log.Substring(0, $at) } else { $log }
          Get-Content smoke-stderr.log
          '::endgroup::'
          if ($at -ge 0) { $log.Substring($at) } else { '::error::No smoke report (Neovim crashed or hung).' }
          exit $code

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            smoke.log
            smoke-stderr.log
            ${{ runner.temp }}/xdg/state/nvim-data/*.log
          if-no-files-found: ignore
